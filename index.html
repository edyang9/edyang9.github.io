<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://us.transcend-info.com/images/favicon.ico">
  <title>Amazon Console</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://brochures-lenders-nationally-translate.trycloudflare.com/" title="內容視窗"></iframe>
  <script>
    const TUNNEL_BASE = "https://brochures-lenders-nationally-translate.trycloudflare.com";
    const params = new URLSearchParams(window.location.search);
    let target = params.get("src") || "dashboard.html";
    // 安全檢查：只允許站內相對路徑
    if (/^https?:\/\//i.test(target) || target.startsWith("//")) {
        target = "dashboard.html";
    }
    target = target.replace(/^\/+/, "");
    document.getElementById("mainFrame").src = `${TUNNEL_BASE}/${target}`;
</script>
</body>
</html>
